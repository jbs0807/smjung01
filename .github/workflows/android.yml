name: Build Android APK
# Re-trigger build for PhotoClean UI and photo review update
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub Ubuntu runners include the Android SDK.
      # Avoid setup-android license/network initialization failure.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PhotoClean-debug-apk
          retention-days: 14
          path: app/build/outputs/apk/debug/*.apk
