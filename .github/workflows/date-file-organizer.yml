name: Build Date File Organizer APK
on:
  workflow_dispatch:
  push:
    branches: [date-file-organizer-build]
    paths:
      - 'DateFileOrganizer/**'
      - '.github/workflows/date-file-organizer.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager"; fi
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon --project-dir DateFileOrganizer assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DateFileOrganizer-debug-apk
          path: DateFileOrganizer/app/build/outputs/apk/debug/*.apk
