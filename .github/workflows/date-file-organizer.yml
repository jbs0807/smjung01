name: Build Date File Organizer APK
on:
  workflow_dispatch:
  push:
    branches: [date-file-organizer-build]
    paths:
      - 'DateFileOrganizer/**'
      - '.github/workflows/date-file-organizer.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager"; fi
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Keep debug signing certificate stable
        uses: actions/cache@v4
        with:
          path: ~/.android/date-organizer-v14.keystore
          key: date-organizer-stable-signing-v14
      - name: Create persistent signing key when absent
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/date-organizer-v14.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/date-organizer-v14.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: Test and build APK
        run: gradle --no-daemon --project-dir DateFileOrganizer testDebugUnitTest assembleDebug
      - name: Verify APK compatibility and signature
        run: |
          APK=DateFileOrganizer/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package:|sdkVersion:|targetSdkVersion:"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo 'Unexpected Internet permission'; exit 1
          fi
          cp "$APK" DateFileOrganizer-v1.5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DateFileOrganizer-v1.5-apk
          path: DateFileOrganizer-v1.5.apk


      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="date-organizer-v1.5-${GITHUB_RUN_ID}"
          gh release create "$TAG" DateFileOrganizer-v1.5.apk --target "$GITHUB_SHA" --title "날짜별 파일 정리 v1.5" --notes-file DateFileOrganizer/CHANGELOG-v1.5-patch.md --latest
