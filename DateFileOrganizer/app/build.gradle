plugins { id 'com.android.application' }
android {
 namespace 'com.example.dateorganizer'
 compileSdk 35
 defaultConfig { applicationId 'com.example.dateorganizer.pro'; minSdk 26; targetSdk 35; versionCode 4; versionName '1.4' }
 signingConfigs {
  debug {
   storeFile file(System.getProperty('user.home') + '/.android/date-organizer-v14.keystore')
   storePassword 'android'
   keyAlias 'androiddebugkey'
   keyPassword 'android'
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {
 implementation 'com.google.mlkit:image-labeling:17.0.9'
 testImplementation 'junit:junit:4.13.2'
}

